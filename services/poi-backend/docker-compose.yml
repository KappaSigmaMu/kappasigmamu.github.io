# Proof-of-Ink backend, for a VM that keeps it running.
#
# One service. It reaches an external Bulletin RPC and Asset Hub RPC over the network,
# so nothing else needs to run alongside it in production.
#
#   cp .env.example .env    # then set OPS_SEED and the endpoints
#   docker compose up -d
#
# For the fully local POC — dev node, IPFS gateway, forked Asset Hub — use
# docker-compose.local.yml, which starts those too.

services:
  poi-backend:
    build:
      # Repo root, not this directory: the PAPI descriptors this service depends on are
      # generated at the root and pulled in through a `portal:` dependency, so they have
      # to be inside the build context.
      context: ../..
      dockerfile: services/poi-backend/Dockerfile
    image: poi-backend:latest
    restart: unless-stopped
    ports:
      # Bound to loopback: put a TLS-terminating reverse proxy in front of it. The
      # service speaks plain HTTP and has no rate limiting of its own.
      - '127.0.0.1:8787:8787'
    environment:
      PORT: 8787
      BULLETIN_WS: ${BULLETIN_WS}
      ASSET_HUB_WS: ${ASSET_HUB_WS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      # Never true outside a local dev chain — see env.example.
      SUDO_BOOTSTRAP: ${SUDO_BOOTSTRAP:-false}
      ALLOW_DEV_SIGNING: ${ALLOW_DEV_SIGNING:-false}
      RENEWAL_WARNING_BLOCKS: ${RENEWAL_WARNING_BLOCKS:-10000}
      # Ops mnemonic, from .env (gitignored, mode 600).
      #
      # As an environment variable this is visible to `docker inspect` and
      # `docker compose config` on the host. Keep the host access-controlled, and
      # treat a host compromise as a compromise of this account.
      OPS_SEED: ${OPS_SEED:?OPS_SEED must be set in .env — run scripts/generate-ops-key.mjs then scripts/seed-to-env.mjs}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
